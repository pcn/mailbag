# Builds and publishes every image, in dependency order.
#
# Replaces build-support.yml and publish.yml, which were separate workflows and
# so could not express ordering: `needs:` cannot span workflows. They ran
# concurrently while the service images built FROM a base another workflow might
# be rewriting at that moment, and nothing rebuilt the base when the support or
# packages images it FROMs changed. That is why the published base sat at
# courier 1.3.10 for a year while install-scripts pinned 1.4.1.
#
# Dependency graph:
#
#   packages ─> base ─> {mta, msa, mta-ssl, imapd-ssl, courierd}
#
#   tinydns has no dependency on base.
#
# The base also installs the template renderer (upstream minijinja-cli) at the
# version and checksums pinned in examples/example-context.json.
#
# A single `changes` job runs paths-filter once and exposes every filter as an
# output. Downstream jobs both `needs:` their upstream (for ordering) and gate
# on those outputs (to skip work). A job also rebuilds when an upstream
# actually rebuilt, which is what makes the base self-heal.

name: Build and publish images

on:
  # Every branch push builds, so any commit yields deployable sha-<sha> images
  # without needing a PR open. pull_request is deliberately absent: with both,
  # a branch with an open PR built twice, and the push trigger already covers
  # every same-repo PR -- fork PRs could never publish anyway, since their token
  # is read-only. For a non-default branch, paths-filter compares against the
  # default branch, so a new branch rebuilds everything that differs from main.
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  # Needed to rebuild something whose own inputs did not change -- a stale
  # published image, or recovering from a partial run.
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.filter.outputs.base }}
      mta: ${{ steps.filter.outputs.mta }}
      msa: ${{ steps.filter.outputs.msa }}
      mta_ssl: ${{ steps.filter.outputs.mta_ssl }}
      imapd_ssl: ${{ steps.filter.outputs.imapd_ssl }}
      courierd: ${{ steps.filter.outputs.courierd }}
      tinydns: ${{ steps.filter.outputs.tinydns }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # This workflow file appears in every filter on purpose: it defines
          # how each image is built, so changing it should rebuild them. The
          # packages image has no filter: it is content-addressed (see the
          # packages job), so it compiles only when its inputs are new.
          filters: |
            base:
              # The packages inputs: a branch whose courier build differs from
              # main must get a base FROM its own packages key, even on pushes
              # where that key already exists and nothing compiles.
              - 'Dockerfile'
              - 'install-scripts/**'
              - 'scripts/packages-key.sh'
              - 'Dockerfile-base'
              - 'acceptmailfor.template'
              - 'hosteddomains.template'
              - 'entrypoints/sv/**'
              # The base ships the build and validation scripts, because the
              # build job runs as a service image.
              - 'scripts/build-courier-dat.sh'
              - 'scripts/validate-courier-dat.pl'
              # The renderer pin the base installs lives here.
              - 'examples/example-context.json'
              - '.github/workflows/build-and-publish.yml'
            mta:
              - 'Dockerfile-mta'
              - 'entrypoints/courier-mta'
              - '.github/workflows/build-and-publish.yml'
            msa:
              - 'Dockerfile-msa'
              - 'entrypoints/courier-msa'
              - '.github/workflows/build-and-publish.yml'
            mta_ssl:
              - 'Dockerfile-mta-ssl'
              - 'entrypoints/courier-mta-ssl'
              - '.github/workflows/build-and-publish.yml'
            imapd_ssl:
              - 'Dockerfile-imapd-ssl'
              - 'entrypoints/courier-imapd-ssl'
              - '.github/workflows/build-and-publish.yml'
            courierd:
              - 'Dockerfile-courierd'
              - 'entrypoints/courier-courierd'
              - '.github/workflows/build-and-publish.yml'
            tinydns:
              - 'Dockerfile-tinydns'
              - 'entrypoints/tinydns'
              - 'tinydns/**'
              - '.github/workflows/build-and-publish.yml'

  # Content-addressed: the courier compile (10-13 min) runs once per set of
  # inputs, not whenever a path filter happens to fire. scripts/packages-key.sh
  # hashes Dockerfile and install-scripts/ -- the only repo files the image is
  # built from -- into pkgs-<hash>. If an image with that tag already exists,
  # this run only adds its own tags to it; otherwise it compiles and pushes.
  # The base then builds FROM exactly that key, so it can never pair with
  # packages compiled from different scripts.
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      key: ${{ steps.key.outputs.key }}
      built: ${{ steps.check.outputs.exists == 'true' && 'false' || 'true' }}
    env:
      # Job-level env cannot read the workflow's env context, so the registry
      # is written out; it matches env.REGISTRY.
      IMAGE: ghcr.io/${{ github.repository }}-packages
    steps:
      - uses: actions/checkout@v4
      - name: Compute the content key
        id: key
        run: echo "key=$(scripts/packages-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.key.outputs.key }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Is this key already built?
        id: check
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.key.outputs.key }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "packages $IMAGE:${{ steps.key.outputs.key }} already built; not compiling"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.exists != 'true'
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      # Manifest-only copy: gives this commit its sha-/branch tags on the
      # existing image in seconds, so every commit still has a packages tag.
      - name: Tag the existing image for this commit
        if: steps.check.outputs.exists == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          args=()
          while read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$IMAGE:${{ steps.key.outputs.key }}"

  base:
    needs: [changes, packages]
    # Rebuild when the base's own inputs changed -- which include the packages
    # inputs, so a branch whose install-scripts differ from main always gets a
    # base built FROM its own packages key rather than falling back to main's
    # base -- or when packages compiled a new key in this run. packages always
    # runs, so it must have succeeded: the base needs its key.
    if: >-
      !cancelled()
      && needs.packages.result == 'success'
      && (needs.changes.outputs.base == 'true'
          || needs.packages.outputs.built == 'true'
          || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      built: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      # The renderer pin lives in the example context, nowhere else.
      - name: Read the renderer pin from the example context
        id: renderer
        run: |
          c=examples/example-context.json
          {
            echo "version=$(jq -er '.tools.minijinja_cli.version' "$c")"
            echo "sha256_x86_64=$(jq -er '.tools.minijinja_cli.sha256["x86_64-unknown-linux-gnu"]' "$c")"
            echo "sha256_aarch64=$(jq -er '.tools.minijinja_cli.sha256["aarch64-unknown-linux-gnu"]' "$c")"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # The packages image is named by the content key of this commit's
          # Dockerfile and install-scripts, never :main, so the base always
          # installs debs compiled from the scripts it was built with.
          build-args: |
            MINIJINJA_CLI_VERSION=${{ steps.renderer.outputs.version }}
            MINIJINJA_CLI_SHA256_X86_64=${{ steps.renderer.outputs.sha256_x86_64 }}
            MINIJINJA_CLI_SHA256_AARCH64=${{ steps.renderer.outputs.sha256_aarch64 }}
            PACKAGES_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}-packages:${{ needs.packages.outputs.key }}

  services:
    needs: [changes, base]
    if: >-
      !cancelled()
      && needs.base.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - key: mta
            image: courier-mta
            file: Dockerfile-mta
          - key: msa
            image: courier-msa
            file: Dockerfile-msa
          - key: mta_ssl
            image: courier-mta-ssl
            file: Dockerfile-mta-ssl
          - key: imapd_ssl
            image: courier-imapd-ssl
            file: Dockerfile-imapd-ssl
          - key: courierd
            image: courier-courierd
            file: Dockerfile-courierd
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      # Gated at the step rather than the job: a matrix job's own `if:` cannot
      # index outputs by matrix.key, and the checkout above is cheap anyway.
      - uses: docker/build-push-action@v6
        if: >-
          needs.changes.outputs[matrix.key] == 'true'
          || needs.base.result == 'success'
          || github.event_name == 'workflow_dispatch'
          || startsWith(github.ref, 'refs/tags/')
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository }}:${{ needs.base.result == 'success' && format('sha-{0}', github.sha) || 'main' }}

  tinydns:
    needs: changes
    if: >-
      needs.changes.outputs.tinydns == 'true'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/djbdns-tinydns
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-tinydns
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # Runs after the images exist, because the .dist files it checks against are
  # read from the image rather than from a checked-in copy. That is deliberate:
  # a courier version bump introducing a new setting has to fail here, and a
  # vendored fixture would quietly agree with itself forever.
  config-completeness:
    needs: [changes, services]
    if: >-
      !cancelled()
      && needs.services.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Every replaced courier config covers its .dist
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/courier-mta:${{ needs.services.result == 'success' && format('sha-{0}', github.sha) || 'main' }}
        run: ./scripts/check-config-completeness.sh
      - name: Every template renders against the example context
        run: ./scripts/render-all-templates.sh
      - name: Repo goss suite (goss pinned in the example context)
        run: '"$(scripts/fetch-goss.sh examples/example-context.json)" -g goss/repo.yaml validate'
