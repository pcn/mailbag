# Packages the built courier databases so that changing them rolls the pods.
#
# Updating a ConfigMap in place does not restart anything: Kubernetes
# re-projects directory mounts after about a minute, subPath mounts never
# update at all, and no rollout is triggered either way -- only a change to a
# Deployment's pod template creates a new ReplicaSet.
#
# configMapGenerator and secretGenerator solve that by hashing the content into
# the object *name* and rewriting every reference to it. The pod template then
# names courier-dat-<hash>, so changed databases change the template and the
# pods roll. The reference is the trigger, so it cannot be forgotten the way a
# hand-stamped annotation can.
#
# It also keeps the blast radius small: the two objects hash independently, so
# a userdb change rolls only the deployments that mount the Secret, not those
# that merely read the config databases.
#
# The old objects are left behind under their previous names, which is what
# makes rollback work -- the previous pod template still references a ConfigMap
# that still exists. They do accumulate, so a deploy should prune.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mailbag

configMapGenerator:
  - name: courier-dat
    # GDBM output is binary; kustomize detects that and emits binaryData.
    files:
      - hosteddomains.dat
      - esmtpacceptmailfor.dat
      - smtpaccess.dat
      - aliases.dat

secretGenerator:
  - name: courier-userdb
    # userdbshadow.dat is password hashes, so these are a Secret.
    files:
      - userdb.dat
      - userdbshadow.dat
