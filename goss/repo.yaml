# Repo-level checks: run from a checkout, with no cluster and no credentials.
#
#   GOSS=$(scripts/fetch-goss.sh examples/example-context.json)
#   "$GOSS" -g goss/repo.yaml validate
#
# Each block names the backlog item whose acceptance it encodes.

file:
  # PROJ-030: every mail port comes from services.*_port in context.json. A
  # literal port, or an /etc/services name such as "smtp", is a second source
  # that can silently disagree with the context.
  deployment/k8s/configmap.yaml:
    exists: true
    contents:
      - '!/^\s*(SSL)?PORT=[^{]/'
      # PROJ-035/PROJ-033: no copy of a context lives in the ConfigMap; pods
      # read the host's /etc/mailbag/context.json.
      - '!/^  context\.json:/'

  # PROJ-035: only what serves the k8s/k3s deployment remains.
  unit-files:
    exists: false
  host:
    exists: false
  client:
    exists: false
  tinydns:
    exists: false
  Dockerfile-tinydns:
    exists: false
  entrypoints/tinydns:
    exists: false
  build-base.sh:
    exists: false
  build-services.sh:
    exists: false
  test-starttls.sh:
    exists: false
  goss/goss.yaml:
    exists: false
  acceptmailfor.template:
    exists: false
  hosteddomains.template:
    exists: false
  deployment/k8s/generate-context.sh:
    exists: false
  deployment/k8s/manage-mail-users.sh:
    exists: false
  deployment/k8s/CERTIFICATE-SETUP.md:
    exists: false
  docs/test-workflow.md:
    exists: false
  deployment/k8s/courier-mta.yaml.template:
    exists: true
    contents: &no-literal-ports
      - '!/containerPort: *[0-9]/'
      - '!/^  - port: *[0-9]/'
      - '!/--port [0-9]/'
  deployment/k8s/courier-msa.yaml.template:
    exists: true
    contents: *no-literal-ports
  deployment/k8s/courier-mta-ssl.yaml.template:
    exists: true
    contents: *no-literal-ports
  deployment/k8s/courier-imapd-ssl.yaml.template:
    exists: true
    contents: *no-literal-ports

  # PROJ-037: courier versions come from cue/packages.cue, as build args; an
  # install script with its own literal version is a second source.
  install-scripts/install-courier.sh:
    exists: true
    contents: &no-literal-version
      - '!/^VER=[0-9]/'
      - '/fetch_source /'
  install-scripts/install-auth.sh:
    exists: true
    contents: *no-literal-version
  install-scripts/install-unicode.sh:
    exists: true
    contents: *no-literal-version
  install-scripts/install-sysconf.sh:
    exists: true
    contents: *no-literal-version

command:
  # PROJ-030
  example context declares every mail port and no msa.port:
    exec: >-
      jq -e '(.services | has("smtp_port") and has("smtps_port")
                          and has("submission_port") and has("imaps_port"))
             and (.msa | has("port") | not)' examples/example-context.json
    exit-status: 0
  # PROJ-030
  non-standard ports render into every place each service uses them:
    exec: goss/lib/check-rendered-ports.sh
    exit-status: 0
    timeout: 60000

  # PROJ-034: cue/schema.cue accepts the example context and rejects each
  # deliberately broken variant (missing or duplicate port, msa.port, an
  # issuer that contradicts tls.source, data_dir under /var, unknown keys,
  # malformed checksums, a missing tool pin).
  the context schema accepts the example and rejects every broken variant:
    exec: goss/lib/check-context-schema.sh
    exit-status: 0
    timeout: 120000
  # PROJ-034: the generator is where new contexts come from. Without
  # userdb.canary and aliases.postmaster, which were missing until the schema
  # existed, a freshly generated context failed its first render.
  generate-context.sh writes a context the schema accepts:
    exec: goss/lib/check-generated-contexts.sh
    exit-status: 0
    timeout: 120000
  # PROJ-035: nothing still points at what was removed. backlog/ and the
  # changelog are history; this file names the patterns, so it is excluded.
  no file references the removed systemd, tinydns or certbot-job paths:
    exec: >-
      git grep -nE 'unit-files|tinydns|test-starttls|build-base\.sh|build-services\.sh|manage-mail-users|CERTIFICATE-SETUP|test-workflow|run-goss|goss/goss\.yaml|certbot|network_name'
      -- . ':!backlog' ':!CHANGELOG.md' ':!goss/repo.yaml'
    exit-status: 1
  # PROJ-037: cue/packages.cue is the one declaration of the courier package
  # versions and checksums; the Dockerfile, install scripts and packages key
  # all follow it, and a download with the wrong checksum is refused.
  the courier package pins are declared once and every consumer follows them:
    exec: goss/lib/check-package-pins.sh
    exit-status: 0
    timeout: 120000
  # PROJ-036: no sha-<commit> service image is built, and no image is
  # checked, when that commit's packages or base build failed.
  service images and the completeness check never run after a failed packages or base build:
    exec: goss/lib/check-ci-guards.sh
    exit-status: 0
    timeout: 60000
  # PROJ-039: each node test gets a fresh canary password; the rotation
  # changes only the canary's systempw and never prints the password.
  the canary password rotation changes only the canary's hash and refuses bad sources:
    exec: goss/lib/check-canary-rotation.sh
    exit-status: 0
    timeout: 60000
  # PROJ-034
  cue is pinned in the example context with a version and a sha256 per target:
    # Every line at the same indent: in a folded scalar a more-indented line
    # keeps its line break, and the file argument would become a separate command.
    exec: >-
      jq -e '.tools.cue.version and (.tools.cue.sha256 | has("x86_64-unknown-linux-gnu") and has("aarch64-unknown-linux-gnu"))'
      examples/example-context.json
    exit-status: 0